---
- hosts: all
  become: true
  gather_facts: False
  vars:
    the_user: "devops"

  tasks:
    - name: create-user
      user:
        name: "{{ the_user }}"
        groups: root
        shell: /bin/bash
        state: present
        create_home: yes

    - name: Create a SSH key
      user:
        name: "{{ the_user }}"
        generate_ssh_key: yes
        ssh_key_bits: 2048
        ssh_key_file: .ssh/id_rsa

    - name: Copy local SSH public key to target
      authorized_key:
        user: "{{ the_user }}"
        state: present
        manage_dir: yes
        key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_rsa.pub') }}"

    - name: set password
      user:
        name: "{{ the_user }}"
        password: "password"
        password_expire_min: 14
        password_expire_max: 60