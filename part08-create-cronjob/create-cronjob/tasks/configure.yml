- name: Ensure cron is installed
  ansible.builtin.apt:
    name: cron
    state: present

- name: Copy memory check script to remote host
  copy:
    src: files/check-memory.sh
    dest: "{{ job_path }}"
    mode: '0755'

- name: Install cronjob
  cron:
    name: Check host memory
    minute: "15"
    hour: "10"
    day: "*"
    month: "*"
    weekday: "*"
    job: "{{ job_path }} >> {{ log_path }} 2>&1"
    user: root
